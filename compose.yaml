name: garmin-data

services:
  app:
    build: .
    image: garmin-data:local
    ports:
      - "127.0.0.1:${GARMIN_PORT:-5080}:8080"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - app-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  app-data:
